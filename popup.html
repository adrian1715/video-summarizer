<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YT Quick Summary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="dot"></span>
        <span>YT Quick Summary</span>
      </div>
      <button id="settings-toggle" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5m7.43-2.53a7.7 7.7 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.97l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.16.57-1.68.97l-2.39-.96a.5.5 0 0 0-.6.22L2.42 8.83a.5.5 0 0 0 .12.62l2.03 1.58a7.7 7.7 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.52.4 1.08.73 1.68.97l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.6-.24 1.16-.57 1.68-.97l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62Z"
          />
        </svg>
      </button>
    </header>

    <!-- Settings -->
    <section id="settings" class="panel hidden">
      <label class="label" for="api-key">Gemini API key</label>
      <div class="key-row">
        <input id="api-key" type="password" placeholder="AIza…" spellcheck="false" autocomplete="off" />
        <button id="key-reveal" class="ghost-btn" type="button">Show</button>
      </div>
      <p class="hint">
        Stored locally in this browser and sent only to Google's API. Get one at
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">aistudio.google.com/apikey</a>.
      </p>
      <div class="row">
        <button id="key-save" class="primary-btn">Save key</button>
        <button id="key-clear" class="ghost-btn">Clear</button>
      </div>
      <p id="settings-status" class="status" role="status"></p>
      <hr />
      <button id="cache-clear" class="ghost-btn wide">Clear cached summaries</button>
    </section>

    <!-- Main -->
    <main id="main">
      <div id="video-box" class="video-box">
        <div id="video-title" class="video-title">Checking current tab…</div>
        <div id="video-id" class="video-id"></div>
      </div>

      <div id="notice" class="notice hidden" role="status"></div>

      <button id="summarize" class="primary-btn wide" disabled>Summarize</button>

      <div id="cache-bar" class="cache-bar hidden">
        <span id="cache-when"></span>
        <button id="resummarize" class="link-btn">Re-summarize</button>
      </div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <div>
          <div class="loading-title">Watching the video…</div>
          <div class="loading-sub">Gemini processes the full video, so this can take a while.</div>
        </div>
      </div>

      <div id="error" class="error hidden" role="alert"></div>

      <article id="summary" class="summary hidden"></article>
    </main>

    <script src="shared/video.js"></script>
    <script src="shared/render.js"></script>
    <script src="shared/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
